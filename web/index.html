<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MyNote 2.0 Web</title>
<style>/* ═══ 样式 ═══ */
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F0F2F5;--card:#fff;--border:#E0E0E0;--text:#333;--sub:#666;--hint:#999;--blue:#1565C0;--green:#2E7D32;--red:#BF360C;--orange:#E65100;--purple:#7B1FA2}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);display:flex;height:100vh;overflow:hidden}
.sidebar{width:320px;min-width:280px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sh{padding:12px 16px;border-bottom:1px solid #E8E8E8;display:flex;align-items:center;gap:8px}
.sh h2{font-size:17px;color:var(--text);flex:1}
.sh button{width:32px;height:32px;border:none;border-radius:8px;cursor:pointer;font-size:15px;background:#F0F0F0;color:#555}
.sh button:hover{background:#E3F2FD;color:var(--blue)}
.ss{margin:8px 12px;display:flex;gap:4px}
.ss input{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none}
.ss input:focus{border-color:#42A5F5}
.tr{flex:1;overflow-y:auto;padding:8px 12px}
.tp{padding:8px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text)}
.tp:hover{background:#F5F5F5}.tp.sel{background:#E3F2FD}
.tp .d{width:10px;height:10px;border-radius:50%;flex-shrink:0}.tp .c{font-size:11px;color:#AAA;margin-left:auto}
.tc{padding-left:24px}
.ts{padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
.ts:hover{background:#F5F5F5}.ts.sel{background:#E3F2FD;color:var(--blue);font-weight:600}
.ts .d{width:8px;height:8px;border-radius:50%;flex-shrink:0}.ts .c{font-size:11px;color:#BBB;margin-left:auto}
.nl{flex:1;overflow-y:auto;padding:4px 8px}
.ni{padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.ni:hover{background:#F5F5F5}.ni.sel{background:#E3F2FD;border-color:#BBDEFB}
.ni .t{font-size:14px;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .p{font-size:12px;color:var(--hint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .m{font-size:11px;color:#BBB;margin-top:2px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--card)}
.tb{padding:6px 12px;background:var(--card);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.tb button,.tb select{padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;font-size:12px;color:#555;white-space:nowrap}
.tb button:hover{background:#F5F5F5}.tb .sp{width:1px;height:24px;background:var(--border);margin:0 4px}
.tb .med{color:#fff;border:none;font-weight:600}.tb .ac{color:var(--blue);border-color:#BBDEFB}
#ti{width:100%;padding:12px 20px;border:none;border-bottom:1px solid var(--border);font-size:20px;font-weight:600;outline:none;background:var(--card)}
#ti::placeholder{color:#CCC}
#tg{width:100%;padding:4px 20px 8px;border:none;border-bottom:1px solid #E8E8E8;font-size:12px;color:var(--hint);outline:none;background:#FAFAFA}
.ed{flex:1;outline:none;padding:20px 24px;font-size:16px;color:var(--text);line-height:1.8;word-wrap:break-word;overflow-wrap:break-word;overflow-y:auto;min-height:200px}
.ed:empty:before{content:attr(data-ph);color:#CCC}
.sb{padding:4px 20px;background:#FAFAFA;border-top:1px solid var(--border);font-size:11px;color:var(--hint);display:flex;justify-content:space-between}
.mo{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);display:none;align-items:center;justify-content:center;z-index:100}
.mo.show{display:flex}
.md{background:var(--card);border-radius:16px;padding:20px;max-width:700px;width:92%;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.15)}
.md h3{margin-bottom:10px;font-size:16px}.md input,.md select,.md textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;margin-bottom:8px;outline:none}
.md .br{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.md button{padding:8px 16px;border:none;border-radius:8px;font-size:13px;cursor:pointer}
.b1{background:var(--blue);color:#fff}.b2{background:#F44336;color:#fff}.b3{background:#F0F0F0;color:#555}
.ctx{position:fixed;background:var(--card);border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.15);padding:4px;display:none;z-index:200;min-width:140px}
.ctx .it{padding:8px 16px;font-size:13px;cursor:pointer;border-radius:8px;color:var(--text)}
.ctx .it:hover{background:#F5F5F5}.ctx .it.dg{color:#F44336}
@media(max-width:700px){body{flex-direction:column}.sidebar{width:100%;min-width:0}.main{display:none}body.editing .sidebar{display:none}body.editing .main{display:flex}}
</style></head><body>

<div class="sidebar"><div class="sh"><h2>📝 MyNote</h2><button title="新建分类" onclick="aP()">📁</button><button title="导出全部" onclick="eA()">⬇</button><button title="设置" onclick="sDlg()">⚙</button></div>
<div class="ss"><input id="sq" placeholder="搜索笔记..." oninput="sr(this.value)"></div>
<div class="tr" id="tr"></div><div class="nl" id="nl"></div></div>

<div class="main"><div class="tb">
<select onchange="fc('formatBlock',this.value);this.selectedIndex=0"><option>正文</option><option value="h1">H1</option><option value="h2">H2</option><option value="h3">H3</option><option value="pre">代码</option></select>
<button onclick="fc('bold')"><b>B</b></button><button onclick="fc('italic')"><i>I</i></button><button onclick="fc('underline')"><u>U</u></button><button onclick="fc('strikeThrough')"><s>S</s></button>
<button onclick="fc('undo')">↩</button><button onclick="fc('redo')">↪</button><button onclick="fontS(1)">A+</button><button onclick="fontS(-1)">A-</button>
<span class="sp"></span>
<button onclick="iSep()">——</button><button onclick="iQ()">"</button><button onclick="iHl()">■</button><button onclick="iCd()">&lt;&gt;</button>
<button onclick="iCk()">☑</button><button onclick="iCa()">🛈</button><button onclick="iWarn()">⚠</button><button onclick="iNum()">1.</button>
<span class="sp"></span>
<button class="med" style="background:var(--orange)" onclick="m('tpl')">模板</button>
<button class="med" style="background:var(--blue)" onclick="m('drug')">药品</button>
<button class="med" style="background:var(--green)" onclick="m('dis')">疾病</button>
<button class="med" style="background:var(--red)" onclick="m('rx')">处方</button>
<button class="med" style="background:var(--purple)" onclick="m('calc')">计算</button>
<span class="sp"></span>
<button class="ac" onclick="m('lab')">检验</button>
<button class="ac" onclick="m('abg')">ABG</button>
<button class="ac" onclick="eC()">导出</button>
<button onclick="gB()" style="margin-left:auto;background:#F5F5F5">← 列表</button>
</div>
<input id="ti" placeholder="笔记标题" oninput="dirty()">
<input id="tg" placeholder="标签（逗号分隔）" oninput="dirty()">
<div id="ed" class="ed" contenteditable="true" data-ph="开始写笔记..." oninput="onEd()"></div>
<div class="sb"><span id="st">就绪</span><span id="wc">0 字</span></div></div>

<div class="mo" id="mo" onclick="if(event.target===this)cl()"><div class="md" id="mc"></div></div>
<div class="ctx" id="ctx"></div>

<script>
//══════ 核心引擎 ══════
const K='mn2',FS=7;var D={ps:[],ns:[]},cn=null,cp=null,cs=null,sq='',dt=null,fs=3;
function ld(){try{var v=JSON.parse(localStorage.getItem(K)||'null');D=v||{ps:[],ns:[]}}catch(e){D={ps:[],ns:[]}}
if(D.ps.length===0){D.ps=[{id:'p1',n:'病历文书',c:'#2196F3',o:0,ss:[{id:'sa',pid:'p1',n:'入院记录',c:'#42A5F5',o:0},{id:'sb',pid:'p1',n:'病程记录',c:'#66BB6A',o:1},{id:'sc',pid:'p1',n:'出院小结',c:'#FFA726',o:2}]},{id:'p2',n:'学习笔记',c:'#4CAF50',o:1,ss:[{id:'sd',pid:'p2',n:'指南解读',c:'#81C784',o:0},{id:'se',pid:'p2',n:'病例分析',c:'#FF8A65',o:1}]},{id:'p3',n:'个人',c:'#9C27B0',o:2,ss:[{id:'sf',pid:'p3',n:'待办',c:'#Ba68C8',o:0}]}];sc()}}
function sc(){localStorage.setItem(K,JSON.stringify(D))}
function gi(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function tm(){return new Date().toISOString().slice(0,16).replace('T',' ')}
function es(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function st(s){return(s||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim()}

function rt(){var e=document.getElementById('tr'),h='<div style="padding:4px 12px 8px;font-size:12px;color:#999;font-weight:600">📂 分类</div>';
D.ps.sort((a,b)=>a.o-b.o).forEach(p=>{var ni=D.ns.filter(n=>n.pid===p.id),ss=p.ss||[],sel=cp===p.id&&!cs;
h+='<div class="tp'+(sel?' sel':'')+'" onclick="sp(\''+p.id+'\')" oncontextmenu="cP(event,\''+p.id+'\');return false"><span class="d" style="background:'+p.c+'"></span>'+es(p.n)+'<span class="c">'+ss.length+'子</span></div>';
if(cp===p.id||ni.length>0){h+='<div class="tc">';
ss.forEach(s=>{var cnt=ni.filter(n=>n.sid===s.id).length;
h+='<div class="ts'+(cs===s.id?' sel':'')+'" onclick="ss(\''+p.id+'\',\''+s.id+'\')" oncontextmenu="cS(event,\''+p.id+'\',\''+s.id+'\');return false"><span class="d" style="background:'+s.c+'"></span>'+es(s.n)+'<span class="c">'+cnt+'</span></div>'});}
e.innerHTML=h;rn()});}

function sp(pid){cp=pid;cs=null;sq='';document.getElementById('sq').value='';rt();var nf=D.ns.filter(function(x){return x.pid===pid}).sort(function(a,b){return(b.p||0)-(a.p||0)||(b.u||'').localeCompare(a.u||'')});if(nf.length>0)op(nf[0].id);else nw()}
function ss(pid,sid){cp=pid;cs=sid;sq='';document.getElementById('sq').value='';rt();var nf=D.ns.filter(function(x){return x.sid===sid}).sort(function(a,b){return(b.p||0)-(a.p||0)||(b.u||'').localeCompare(a.u||'')});if(nf.length>0)op(nf[0].id);else nw()}
function aP(){var n=prompt('大分类名称：');if(!n)return;D.ps.push({id:'p_'+gi(''),n,c:'#'+Math.floor(Math.random()*0xFFFFFF).toString(16).padStart(6,'0'),o:D.ps.length,ss:[]});sc();rt()}
function aS(pid){var n=prompt('子分类名称：');if(!n)return;var p=D.ps.find(p=>p.id===pid);if(!p)return;if(!p.ss)p.ss=[];p.ss.push({id:'s_'+gi(''),pid,n,c:p.c,o:p.ss.length});sc();rt()}
function rP(pid){var p=D.ps.find(p=>p.id===pid);if(!p)return;var n=prompt('新名称：',p.n);if(n){p.n=n;sc();rt()}}
function rS(pid,sid){var p=D.ps.find(p=>p.id===pid);var s=p&&p.ss&&p.ss.find(s=>s.id===sid);if(!s)return;var n=prompt('新名称：',s.n);if(n){s.n=n;sc();rt()}}
function dP(pid){if(!confirm('确定删除此分类及所有笔记？'))return;D.ps=D.ps.filter(p=>p.id!==pid);D.ns=D.ns.filter(n=>n.pid!==pid);if(cp===pid){cp=null;cs=null}sc();rt()}
function dS(pid,sid){if(!confirm('确定删除此子分类及笔记？'))return;var p=D.ps.find(p=>p.id===pid);if(p)p.ss=(p.ss||[]).filter(s=>s.id!==sid);D.ns=D.ns.filter(n=>!(n.pid===pid&&n.sid===sid));if(cs===sid)cs=null;sc();rt()}
function cP(e,pid){e.preventDefault();xC(e,[{l:'重命名',f:()=>rP(pid)},{l:'新建子分类',f:()=>aS(pid)},{l:'删除',dg:true,f:()=>dP(pid)}])}
function cS(e,pid,sid){e.preventDefault();xC(e,[{l:'重命名',f:()=>rS(pid,sid)},{l:'删除',dg:true,f:()=>dS(pid,sid)}])}
function xC(e,it){var el=document.getElementById('ctx');el.innerHTML=it.map(i=>'<div class="it'+(i.dg?' dg':'')+'" onclick="('+i.f.toString()+')();hC()">'+i.l+'</div>').join('');el.style.display='block';el.style.left=Math.min(e.clientX,window.innerWidth-160)+'px';el.style.top=Math.min(e.clientY,window.innerHeight-it.length*36)+'px';setTimeout(()=>document.addEventListener('click',hC,{once:true}),100)}
function hC(){document.getElementById('ctx').style.display='none'}

function rn(){var el=document.getElementById('nl'),list=D.ns;
if(cs)list=list.filter(n=>n.sid===cs);else if(cp)list=list.filter(n=>n.pid===cp);else list=[];
if(sq)list=list.filter(n=>(n.t||'').toLowerCase().includes(sq)||st(n.c||'').toLowerCase().includes(sq)||(n.tg||'').toLowerCase().includes(sq));
list.sort((a,b)=>(b.p||0)-(a.p||0)||(b.u||'').localeCompare(a.u||''));
el.innerHTML=list.length===0?'<div style="text-align:center;color:#BBB;padding:20px;font-size:12px">'+(cp?'点击 ＋ 新建笔记':'选择左侧分类')+'</div>':
list.map(n=>'<div class="ni'+(n.id===cn?' sel':'')+'" onclick="op(\''+n.id+'\')"><div class="t">'+(n.p?'⭐ ':'')+es(n.t||'无标题')+'</div><div class="p">'+es(st(n.c||'').slice(0,50))+'</div><div class="m">'+(n.u||'').slice(5)+(n.tg?' · '+es(n.tg).slice(0,25):'')+'</div></div>').join('')}
function sr(q){sq=q.toLowerCase().trim();rn()}

function nw(){if(!cp&&!cs&&D.ps.length>0){cp=D.ps[0].id;if(D.ps[0].ss&&D.ps[0].ss.length>0)cs=D.ps[0].ss[0].id;rt()}if(!cp){alert('请先创建分类');return}
var n={id:gi('n_'),pid:cp,sid:cs||'',t:'新笔记',c:'',tg:'',p:0,cr:tm(),u:tm()};D.ns.unshift(n);cn=n.id;sc();rt();le();document.body.classList.add('editing')}
function op(id){cn=id;le();rt();document.body.classList.add('editing')}function le(){var n=D.ns.find(function(x){return x.id===cn});if(n){document.getElementById('ti').value=n.t||'';document.getElementById('tg').value=n.tg||'';document.getElementById('ed').innerHTML=n.c||'';document.getElementById('st').textContent='已加载';uw()}else{ce()}}function ce(){document.getElementById('ti').value='';document.getElementById('tg').value='';document.getElementById('ed').innerHTML='';uw()}
function dirty(){document.getElementById('st').textContent='● 未保存';if(dt)clearTimeout(dt);dt=setTimeout(av,2000)}function onEd(){dirty()}
function av(){if(!cn)return;var n=D.ns.find(n=>n.id===cn);if(!n)return;n.t=document.getElementById('ti').value||'新笔记';n.tg=document.getElementById('tg').value||'';n.c=document.getElementById('ed').innerHTML;n.u=tm();sc();rn();rt();document.getElementById('st').textContent='已保存';uw()}
function uw(){var t=(document.getElementById('ed').innerText||'').replace(/[^\u4e00-\u9fa5\u3400-\u4dbfa-zA-Z0-9]/g,'');document.getElementById('wc').textContent=t.length+' 字'}
function tP(){if(!cn)return;var n=D.ns.find(n=>n.id===cn);if(!n)return;n.p=n.p?0:1;sc();rn()}
function dN(){if(!cn||!confirm('确定删除？'))return;D.ns=D.ns.filter(n=>n.id!==cn);cn=null;sc();rt();ce()}

function fc(c,v){document.execCommand(c,false,v||null);document.getElementById('ed').focus();dirty()}
function ih(h){document.getElementById('ed').focus();document.execCommand('insertHTML',false,h);dirty()}
function iA(h){cl();var e=document.getElementById('ed');e.focus();setTimeout(function(){document.execCommand('insertHTML',false,h);dirty()},50)}
function fontS(d){fs=Math.min(7,Math.max(1,fs+d));fc('fontSize',fs)}
function iSep(){ih('<div style="text-align:center;margin:10px 0;color:#BDBDBD;font-size:12px;letter-spacing:6px">—— ◆ ——</div><br>')}
function iQ(){ih('<div style="border-left:4px solid #1565C0;padding:10px 14px;margin:8px 0;background:#E3F2FD;border-radius:0 6px 6px 0;color:#37474F;font-size:15px;font-style:italic"><br></div><br>')}
function iHl(){ih('<div style="background:linear-gradient(90deg,#FFF9C4,#FFF176);padding:10px 14px;margin:8px 0;border-radius:8px;border:1px solid #FFD54F;font-size:15px;color:#5D4037"><br></div><br>')}
function iCd(){ih('<div style="background:#263238;color:#A5D6A7;font-family:monospace;font-size:13px;padding:10px 14px;margin:8px 0;border-radius:8px;border-left:3px solid #FFB300;white-space:pre-wrap"><br></div><br>')}
function iCk(){ih('<div style="margin:6px 0"><div>☐ </div><div>☐ </div><div>☐ </div></div><br>')}
function iCa(){ih('<div style="background:#E3F2FD;padding:10px 14px;margin:8px 0;border-radius:8px;font-size:14px"><b>检查：</b><br><b>结果：</b><br><b>诊断：</b></div><br>')}
function iWarn(){ih('<div style="background:#FFEBEE;padding:10px 14px;margin:8px 0;border-radius:6px;border-left:4px solid #F44336;font-size:15px;color:#C62828;font-weight:bold">⚠ </div><br>')}
function iNum(){var n=parseInt(prompt('几项编号？','5'))||5;var h='<div style="margin:6px 0">';for(var i=1;i<=n;i++)h+='<div>'+i+'. </div>';h+='</div><br>';ih(h)}

function cl(){document.getElementById('mo').classList.remove('show')}
function sDlg(){var o=document.getElementById('mo'),c=document.getElementById('mc');c.innerHTML='<h3>📋 设置</h3><p style="color:#666;font-size:13px">总笔记: '+D.ns.length+' 条 | 分类: '+D.ps.length+' 个</p><p style="color:#666;font-size:13px">存储: '+(new Blob([JSON.stringify(D)]).size/1024).toFixed(1)+' KB</p><p style="color:#999;font-size:11px;margin-top:8px">数据存在浏览器本地<br>清除浏览器数据会丢失笔记，请定期导出备份</p><div class="br">'+(cn?'<button class="b1" onclick="tP();cl()">⭐ 置顶/取消</button>':'')+(cn?'<button class="b2" onclick="dN();cl()">删除当前笔记</button>':'')+'<button class="b2" onclick="if(confirm(\'确定清除所有数据？\')){localStorage.removeItem(\''+K+'\');location.reload()}">清除全部</button><button class="b3" onclick="cl()">关闭</button></div>';o.classList.add('show')}

function m(t){var o=document.getElementById('mo'),c=document.getElementById('mc'),h='';if(t==='tpl'){h='<h3>📋 病历模板 ('+TPLS.length+')</h3><input id="ms" placeholder="搜索模板..." oninput="fl()" style="margin-bottom:8px"><div id="ml" style="max-height:55vh;overflow-y:auto">';TPLS.forEach((x,i)=>{h+='<div class="ti" data-q="'+(x.t+x.c).toLowerCase()+'" onclick="iT('+i+')" style="padding:10px;margin:4px 0;border:1px solid #E0E0E0;border-radius:8px;cursor:pointer;font-size:13px;color:var(--orange);font-weight:600">'+x.t+'</div>'});h+='</div>'}
else if(t==='drug'){h='<h3>💊 药品参考 ('+DRUGS.length+')</h3><input id="ms" placeholder="搜索药品/科室..." oninput="fl()" style="margin-bottom:8px"><div id="ml" style="max-height:55vh;overflow-y:auto">';DRUGS.forEach((x,i)=>{h+='<div class="dg" data-q="'+(x.n+x.d+x.u).toLowerCase()+'" onclick="iD('+i+')" style="padding:10px;margin:4px 0;border:1px solid #E0E0E0;border-radius:8px;cursor:pointer;font-size:13px"><div style="font-weight:600;color:var(--blue)">'+x.n+' <span style="color:#888;font-size:11px;font-weight:400">'+x.d+'</span></div><div style="color:#999;font-size:11px;margin-top:2px">'+x.u+'</div></div>'});h+='</div>'}
else if(t==='dis'){h='<h3>🩺 疾病速查 ('+DISS.length+')</h3><input id="ms" placeholder="搜索疾病/科室/症状..." oninput="fl()" style="margin-bottom:8px"><div id="ml" style="max-height:55vh;overflow-y:auto">';DISS.forEach((x,i)=>{h+='<div class="ds" data-q="'+(x.n+x.d+x.s).toLowerCase()+'" onclick="iS('+i+')" style="padding:10px;margin:4px 0;border:1px solid #E0E0E0;border-radius:8px;cursor:pointer;font-size:13px"><div style="font-weight:600;color:var(--green)">'+x.n+' <span style="color:#888;font-size:11px;font-weight:400">'+x.d+'</span></div><div style="color:#999;font-size:11px;margin-top:2px">症状: '+x.s+'</div></div>'});h+='</div>'}

var CALCS=[{t:"BMI 体重指数",f:'<label style="font-size:12px">体重(kg)</label><input id="f_w" type="number" step="0.1"><label style="font-size:12px">身高(cm)</label><input id="f_h" type="number" step="0.1">',fs:[{k:'w'},{k:'h'}],fn:function(v){var b=v.w/((v.h/100)*(v.h/100));return'<b>BMI: '+b.toFixed(1)+'</b><br>'+(b<18.5?'偏瘦':b<24?'正常':b<28?'超重':'肥胖')}},{t:"CURB-65 肺炎评分",f:'<label style="font-size:12px">意识障碍(是=1,否=0)</label><input id="f_c" type="number" min="0" max="1"><label style="font-size:12px">BUN>7 mmol/L(是=1)</label><input id="f_u" type="number" min="0" max="1"><label style="font-size:12px">RR≥30(是=1)</label><input id="f_r" type="number" min="0" max="1"><label style="font-size:12px">SBP<90或DBP≤60(是=1)</label><input id="f_b" type="number" min="0" max="1"><label style="font-size:12px">年龄≥65(是=1)</label><input id="f_a" type="number" min="0" max="1">',fs:[{k:'c'},{k:'u'},{k:'r'},{k:'b'},{k:'a'}],fn:function(v){var s=v.c+v.u+v.r+v.b+v.a;return'<b>评分: '+s+'/5</b><br>'+(s<=1?'门诊':s===2?'住院考虑':'ICU')}},{t:"GFR CKD-EPI",f:'<label style="font-size:12px">肌酐(μmol/L)</label><input id="f_cr" type="number"><label style="font-size:12px">年龄</label><input id="f_age" type="number"><label style="font-size:12px">性别(男=1,女=0)</label><input id="f_sex" type="number" min="0" max="1">',fs:[{k:'cr'},{k:'age'},{k:'sex'}],fn:function(v){var cr=v.cr/88.4,f=v.sex?1:1.018,a=v.sex?-0.411:-0.329,k=v.sex?0.9:0.7;var e=141*Math.pow(Math.min(cr/k,1),a)*Math.pow(Math.max(cr/k,1),-1.209)*Math.pow(0.993,v.age)*f;return'<b>eGFR: '+Math.round(e)+' mL/min</b><br>'+(e>=90?'G1':e>=60?'G2':e>=45?'G3a':e>=30?'G3b':e>=15?'G4':'G5')}},{t:"MAP 平均动脉压",f:'<label>收缩压(mmHg)</label><input id="f_s" type="number"><label>舒张压(mmHg)</label><input id="f_d" type="number">',fs:[{k:'s'},{k:'d'}],fn:function(v){var m=(v.s+2*v.d)/3;return'<b>MAP: '+Math.round(m)+' mmHg</b><br>'+(m<65?'偏低(休克风险)':'正常')}},{t:"QTc Bazett",f:'<label>QT(ms)</label><input id="f_qt" type="number"><label>RR(ms)</label><input id="f_rr" type="number">',fs:[{k:'qt'},{k:'rr'}],fn:function(v){var q=v.qt/Math.sqrt(v.rr/1000);return'<b>QTc: '+Math.round(q)+' ms</b><br>'+(q>500?'⚠ 显著延长':q>460?'⚠ 延长':'正常')}},{t:"CHA₂DS₂-VASc",f:'<label>心衰(1)</label><input id="f_chf" type="number" min="0" max="1"><label>高血压(1)</label><input id="f_htn" type="number" min="0" max="1"><label>≥75岁(2)</label><input id="f_a75" type="number" min="0" max="2"><label>糖尿病(1)</label><input id="f_dm" type="number" min="0" max="1"><label>卒中TIA(2)</label><input id="f_str" type="number" min="0" max="2"><label>血管病(1)</label><input id="f_vd" type="number" min="0" max="1"><label>65-74岁(1)</label><input id="f_a65" type="number" min="0" max="1"><label>女性(1)</label><input id="f_f" type="number" min="0" max="1">',fs:[{k:'chf'},{k:'htn'},{k:'a75'},{k:'dm'},{k:'str'},{k:'vd'},{k:'a65'},{k:'f'}],fn:function(v){var s=v.chf+v.htn+v.a75+v.dm+v.str+v.vd+v.a65+v.f;return'<b>CHA₂DS₂-VASc: '+s+'</b><br>'+(s>=2?'推荐抗凝':s===1?'考虑抗凝':'不推荐')}},{t:"Wells DVT评分",f:'<label>活动性肿瘤(1)</label><input id="f_w1" type="number" min="0" max="1"><label>瘫痪/近期石膏(1)</label><input id="f_w2" type="number" min="0" max="1"><label>卧床>3天/大手术4周内(1)</label><input id="f_w3" type="number" min="0" max="1"><label>沿深静脉压痛(1)</label><input id="f_w4" type="number" min="0" max="1"><label>全腿肿胀(1)</label><input id="f_w5" type="number" min="0" max="1"><label>小腿肿胀>3cm(1)</label><input id="f_w6" type="number" min="0" max="1"><label>凹陷性水肿(1)</label><input id="f_w7" type="number" min="0" max="1"><label>浅静脉侧支(1)</label><input id="f_w8" type="number" min="0" max="1"><label>既往DVT史(1)</label><input id="f_w9" type="number" min="0" max="1"><label>别诊断可能≥DVT(-2)</label><input id="f_w10" type="number" min="-2" max="0">',fs:[{k:'w1'},{k:'w2'},{k:'w3'},{k:'w4'},{k:'w5'},{k:'w6'},{k:'w7'},{k:'w8'},{k:'w9'},{k:'w10'}],fn:function(v){var s=v.w1+v.w2+v.w3+v.w4+v.w5+v.w6+v.w7+v.w8+v.w9+v.w10;return'<b>Wells DVT: '+s+'</b><br>'+(s>=2?'DVT可能性大→超声+抗凝':s<=0?'低风险→D-二聚体':'中风险→超声')}},{t:"APACHE II快速估算",f:'<label>GCS (3-15)</label><input id="f_g
