# Gradle JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 强制使用 JDK 17（Kotlin 1.9 不支持 Java 25）
org.gradle.java.home=C\:/Users/Administrator/.jdks/jbr-17.0.14

# Gradle 性能
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# 禁用 IDE 自动下载 Gradle 源码（否则 Android Studio 同步会去 services.gradle.org 下 gradle-8.11.1-src.zip 被墙超时）
systemProp.ides.downloadSources=false
